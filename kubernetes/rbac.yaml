# Apply separately if using a service-account identity instead of local kubeconfig.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-agent-reader
  namespace: mlops-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlops-agent-reader
  namespace: mlops-agent
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, events, endpoints]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: ["iris-api:80"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-agent-reader
  namespace: mlops-agent
subjects:
  - kind: ServiceAccount
    name: mlops-agent-reader
    namespace: mlops-agent
roleRef:
  kind: Role
  name: mlops-agent-reader
  apiGroup: rbac.authorization.k8s.io
